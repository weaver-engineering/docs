# Canonical stopword list (root forms) for .index/<slug>.words.yaml, per
# documentation-standards.md §4. Words reduce to a root before this list is
# checked, so an entry here blocks all its inflections too (e.g. "be" blocks
# is/are/was/were/been/being; "document" blocks doc/docs/documents/
# documented/documentation).
#
# This is a starting point: a generic English list plus domain terms whose
# ubiquity in this corpus gives them little discriminating power for search.
# Expected to be refined over time via retrospective analysis of index
# bloat, not fixed permanently at authoring time.

stopwords:
  # generic English
  - a
  - an
  - the
  - and
  - or
  - but
  - if
  - then
  - than
  - so
  - such
  - from
  - into
