<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 266" width="100%" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<style>:root{--bg:#fff;--fg:#212121;--faint:#9e9e9e;--box:#e8f5e9;--boxline:#2e7d32;--cur:#fff8e1;--curline:#f57f17;--plan:#fafafa;--planline:#bdbdbd;--arrow:#757575;--ok:#2e7d32}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--faint:#6e7681;--box:#12261a;--boxline:#3fb950;--cur:#2d2208;--curline:#ffb74d;--plan:#161b22;--planline:#484f58;--arrow:#8b949e;--ok:#3fb950}}.t{fill:var(--fg)}.f{fill:var(--faint)}.ok{fill:var(--ok)}</style>
<defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--arrow)"/></marker><marker id="o" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--curline)"/></marker></defs>
<rect width="818" height="266" fill="var(--bg)"/>
<rect x="30" y="24" width="150" height="44" rx="6" fill="var(--box)" stroke="var(--boxline)"/>
<text class="t" x="105" y="50" text-anchor="middle" font-weight="400">1 hackathon</text>
<path d="M184,46 H222" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#h)"/>
<rect x="226" y="24" width="150" height="44" rx="6" fill="var(--cur)" stroke="var(--curline)" stroke-width="3"/>
<text class="t" x="301" y="50" text-anchor="middle" font-weight="600">2 dem-ambient</text>
<path d="M380,46 H418" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#h)" stroke-dasharray="4 3"/>
<rect x="422" y="24" width="150" height="44" rx="6" fill="var(--plan)" stroke="var(--planline)" stroke-dasharray="6 4"/>
<text class="f" x="497" y="50" text-anchor="middle" font-weight="400">3 teams</text>
<line x1="30" y1="102" x2="788" y2="102" stroke="var(--planline)" stroke-width="1.5"/>
<rect x="30" y="146" width="230" height="96" rx="6" fill="var(--plan)" stroke="var(--planline)" stroke-dasharray="6 4"/>
<text class="t" x="42" y="168" font-weight="600">2.1 The Local Service</text>
<text class="t" x="42" y="200" font-size="12">•</text>
<text class="t" x="56" y="200" font-size="12">file watching</text>
<text class="t" x="42" y="216" font-size="12">•</text>
<text class="t" x="56" y="216" font-size="12">the claim store on disk</text>
<text class="t" x="42" y="232" font-size="12">•</text>
<text class="t" x="56" y="232" font-size="12">session discovery</text>
<path d="M263,194 H291" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#h)"/>
<rect x="294" y="146" width="230" height="96" rx="6" fill="var(--plan)" stroke="var(--planline)" stroke-dasharray="6 4"/>
<text class="t" x="306" y="168" font-weight="600">2.2 The Review UI</text>
<text class="t" x="306" y="200" font-size="12">•</text>
<text class="t" x="320" y="200" font-size="12">the diff view</text>
<text class="t" x="306" y="216" font-size="12">•</text>
<text class="t" x="320" y="216" font-size="12">the editing chat head</text>
<path d="M527,194 H555" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#h)"/>
<rect x="558" y="146" width="230" height="96" rx="6" fill="var(--plan)" stroke="var(--planline)" stroke-dasharray="6 4"/>
<text class="t" x="570" y="168" font-weight="600">2.3 Linking The Agent Team</text>
<text class="t" x="570" y="200" font-size="12">•</text>
<text class="t" x="584" y="200" font-size="12">message relay</text>
<text class="t" x="570" y="216" font-size="12">•</text>
<text class="t" x="584" y="216" font-size="12">resuming a stopped worker</text>
<text class="t" x="570" y="232" font-size="12">•</text>
<text class="t" x="584" y="232" font-size="12">applying a chosen resolution</text>
<path d="M301,72 V138" stroke="var(--curline)" stroke-width="2" marker-end="url(#o)"/>
</svg>
