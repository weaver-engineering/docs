<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 644" width="100%" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<style>:root{--bg:#fff;--fg:#212121;--faint:#9e9e9e;--grid:#eee;--bar:#90caf9;--barline:#1565c0;--cur:#ffe082;--curline:#f57f17;--plan:#bdbdbd;--planline:#616161;--sum:#455a64;--arrow:#f57f17}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--faint:#6e7681;--grid:#21262d;--bar:#1f4e79;--barline:#58a6ff;--cur:#6b4f0f;--curline:#ffb74d;--plan:#484f58;--planline:#8b949e;--sum:#8b949e;--arrow:#ffb74d}}.t{fill:var(--fg)}.f{fill:var(--faint)}.h{font-weight:600}</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--arrow)"/></marker></defs>
<rect width="1300" height="644" fill="var(--bg)"/>
<line x1="360" y1="66" x2="360" y2="620" stroke="var(--grid)"/>
<text class="f" x="360" y="60" text-anchor="middle">0</text>
<line x1="485" y1="66" x2="485" y2="620" stroke="var(--grid)"/>
<text class="f" x="485" y="60" text-anchor="middle">5</text>
<line x1="610" y1="66" x2="610" y2="620" stroke="var(--grid)"/>
<text class="f" x="610" y="60" text-anchor="middle">10</text>
<line x1="735" y1="66" x2="735" y2="620" stroke="var(--grid)"/>
<text class="f" x="735" y="60" text-anchor="middle">15</text>
<line x1="860" y1="66" x2="860" y2="620" stroke="var(--grid)"/>
<text class="f" x="860" y="60" text-anchor="middle">20</text>
<line x1="985" y1="66" x2="985" y2="620" stroke="var(--grid)"/>
<text class="f" x="985" y="60" text-anchor="middle">25</text>
<line x1="1110" y1="66" x2="1110" y2="620" stroke="var(--grid)"/>
<text class="f" x="1110" y="60" text-anchor="middle">30</text>
<line x1="1235" y1="66" x2="1235" y2="620" stroke="var(--grid)"/>
<text class="f" x="1235" y="60" text-anchor="middle">35</text>
<text class="f" x="360" y="16">units of complexity, from the day the roadmap was last updated; an arrow runs from what is needed to what needs it</text>
<rect x="360" y="28" width="22" height="12" rx="3" fill="var(--cur)" stroke="var(--curline)" opacity="1"/>
<text class="f" x="388" y="38" font-size="11">the current slice</text>
<rect x="514" y="28" width="22" height="12" rx="3" fill="var(--plan)" stroke="var(--planline)" opacity="0.85"/>
<text class="f" x="542" y="38" font-size="11">planned slices, fainter the further out</text>
<rect x="800" y="28" width="22" height="12" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="f" x="828" y="38" font-size="11">in no slice yet</text>
<text class="t h" x="12" y="91">the ambient service</text>
<path d="M370,82 v10 M1050,82 v10 M370,87 H1050" stroke="var(--sum)" stroke-width="2" fill="none"/>
<text class="t h" x="30" y="117">the local service</text>
<path d="M370,108 v10 M675,108 v10 M370,113 H675" stroke="var(--sum)" stroke-width="2" fill="none"/>
<text class="t" x="48" y="143">file watching</text>
<rect x="370" y="131" width="55" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="397.5" y="143" text-anchor="middle" font-size="11">3</text>
<text class="t" x="48" y="169">the claim store on disk</text>
<rect x="445" y="157" width="105" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="497.5" y="169" text-anchor="middle" font-size="11">5</text>
<text class="t h" x="48" y="195">the agent link</text>
<path d="M370,186 v10 M675,186 v10 M370,191 H675" stroke="var(--sum)" stroke-width="2" fill="none"/>
<text class="t" x="66" y="221">session discovery</text>
<rect x="370" y="209" width="30" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="385" y="221" text-anchor="middle" font-size="11">2</text>
<text class="t" x="66" y="247">message relay</text>
<rect x="420" y="235" width="180" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="510" y="247" text-anchor="middle" font-size="11">8</text>
<text class="f" x="66" y="273">resuming a stopped worker</text>
<rect x="620" y="261" width="55" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" stroke-dasharray="4 3" opacity="0.55"/>
<text class="t" x="647.5" y="273" text-anchor="middle" font-size="11">3</text>
<text class="t h" x="30" y="299">the review UI</text>
<path d="M570,290 v10 M1050,290 v10 M570,295 H1050" stroke="var(--sum)" stroke-width="2" fill="none"/>
<text class="t" x="48" y="325">the diff view</text>
<rect x="570" y="313" width="180" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="660" y="325" text-anchor="middle" font-size="11">8</text>
<text class="t h" x="48" y="351">the editing chat head</text>
<path d="M620,342 v10 M1050,342 v10 M620,347 H1050" stroke="var(--sum)" stroke-width="2" fill="none"/>
<text class="t" x="66" y="377">the chat panel</text>
<rect x="620" y="365" width="105" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="672.5" y="377" text-anchor="middle" font-size="11">5</text>
<text class="t" x="66" y="403">applying a chosen resolution</text>
<rect x="745" y="391" width="305" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="897.5" y="403" text-anchor="middle" font-size="11">13</text>
<text class="f" x="48" y="429">the analyst's view of the work</text>
<rect x="770" y="417" width="180" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" stroke-dasharray="4 3" opacity="0.55"/>
<text class="t" x="860" y="429" text-anchor="middle" font-size="11">8</text>
<text class="t h" x="12" y="455">roadmap tooling</text>
<path d="M370,446 v10 M425,446 v10 M370,451 H425" stroke="var(--sum)" stroke-width="2" fill="none"/>
<text class="t" x="30" y="481">ending a phase</text>
<rect x="370" y="469" width="55" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="397.5" y="481" text-anchor="middle" font-size="11">3</text>
<text class="t" x="30" y="507">the phase history</text>
<rect x="370" y="495" width="30" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="385" y="507" text-anchor="middle" font-size="11">2</text>
<text class="t h" x="12" y="533">aspects on their own</text>
<text class="t" x="30" y="559">search</text>
<rect x="370" y="547" width="305" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="522.5" y="559" text-anchor="middle" font-size="11">13</text>
<text class="t" x="30" y="585">renames</text>
<rect x="695" y="573" width="105" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="747.5" y="585" text-anchor="middle" font-size="11">5</text>
<text class="t" x="30" y="611">the roadmapper agent</text>
<rect x="1070" y="599" width="180" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="1160" y="611" text-anchor="middle" font-size="11">8</text>
<path d="M425,139 H428 V165 H445" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M400,217 H405.4 V243 H420" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M600,243 H607.8 V269 H620" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M550,165 H560.2 V295 H570" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M600,243 H607.8 V347 H620" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M725,373 H737.6 V399 H745" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M750,321 H765 V425 H770" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M675,555 H678 V581 H695" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M1050,295 H1055.4 V607 H1070" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M425,451 H432.8 V607 H1070" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
</svg>
