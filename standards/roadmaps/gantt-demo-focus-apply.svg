<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 364" width="100%" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<style>:root{--bg:#fff;--fg:#212121;--faint:#9e9e9e;--grid:#eee;--bar:#90caf9;--barline:#1565c0;--sum:#455a64;--arrow:#f57f17}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--faint:#6e7681;--grid:#21262d;--bar:#1f4e79;--barline:#58a6ff;--sum:#8b949e;--arrow:#ffb74d}}.t{fill:var(--fg)}.f{fill:var(--faint)}.h{font-weight:600}</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--arrow)"/></marker></defs>
<rect width="1300" height="364" fill="var(--bg)"/>
<line x1="360" y1="46" x2="360" y2="340" stroke="var(--grid)"/>
<text class="f" x="360" y="40" text-anchor="middle">0</text>
<line x1="520.71" y1="46" x2="520.71" y2="340" stroke="var(--grid)"/>
<text class="f" x="520.71" y="40" text-anchor="middle">5</text>
<line x1="681.43" y1="46" x2="681.43" y2="340" stroke="var(--grid)"/>
<text class="f" x="681.43" y="40" text-anchor="middle">10</text>
<line x1="842.14" y1="46" x2="842.14" y2="340" stroke="var(--grid)"/>
<text class="f" x="842.14" y="40" text-anchor="middle">15</text>
<line x1="1002.86" y1="46" x2="1002.86" y2="340" stroke="var(--grid)"/>
<text class="f" x="1002.86" y="40" text-anchor="middle">20</text>
<line x1="1163.57" y1="46" x2="1163.57" y2="340" stroke="var(--grid)"/>
<text class="f" x="1163.57" y="40" text-anchor="middle">25</text>
<text class="f" x="360" y="16">units of complexity, from the day the roadmap was last updated; an arrow runs from what is needed to what needs it</text>
<text class="t h" x="12" y="71">the ambient service</text>
<path d="M370,62 v10 M1250,62 v10 M370,67 H1250" stroke="var(--sum)" stroke-width="2" fill="none"/>
