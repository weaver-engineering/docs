<text class="t" x="761.79" y="305" text-anchor="middle" font-size="11">5</text>
<text class="t" x="66" y="331">applying a chosen resolution</text>
<rect x="2" y="315" width="1296" height="24" rx="4" fill="none" stroke="var(--arrow)" stroke-width="2"/>
<rect x="852.14" y="319" width="397.86" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="1051.07" y="331" text-anchor="middle" font-size="11">13</text>
<path d="M446.43,119 H449.43 V145 H466.43" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
