<text class="t" x="408.21" y="123" text-anchor="middle" font-size="11">3</text>
<text class="t" x="48" y="149">the claim store on disk</text>
<rect x="466.43" y="137" width="140.71" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="536.79" y="149" text-anchor="middle" font-size="11">5</text>
<text class="t h" x="48" y="175">the agent link</text>
<path d="M370,166 v10 M767.86,166 v10 M370,171 H767.86" stroke="var(--sum)" stroke-width="2" fill="none"/>
<text class="t" x="66" y="201">session discovery</text>
<rect x="370" y="189" width="44.29" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="392.14" y="201" text-anchor="middle" font-size="11">2</text>
<text class="t" x="66" y="227">message relay</text>
<rect x="434.29" y="215" width="237.14" height="16" rx="3" fill="var(--bar)" stroke="var(--barline)" opacity="1"/>
<text class="t" x="552.86" y="227" text-anchor="middle" font-size="11">8</text>
<text class="t h" x="30" y="253">the review UI</text>
<path d="M627.14,244 v10 M1250,244 v10 M627.14,249 H1250" stroke="var(--sum)" stroke-width="2" fill="none"/>
<text class="t h" x="48" y="279">the editing chat head</text>
<path d="M691.43,270 v10 M1250,270 v10 M691.43,275 H1250" stroke="var(--sum)" stroke-width="2" fill="none"/>
