<path d="M607.14,145 H614.94 V249 H627.14" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M671.43,223 H681.63 V275 H691.43" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M832.14,301 H844.74 V327 H852.14" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#head)"/>
</svg>
